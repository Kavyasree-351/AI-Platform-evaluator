<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title description">
  <title id="title">AI Platform Evaluator walkthrough</title>
  <desc id="description">A card freeze answer passes. An answer promising 24.5 percent APY is flagged because the demo policy specifies a variable 3 percent rate. These are illustrative verdicts.</desc>
  <rect width="960" height="440" rx="24" fill="#101827"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="36" y="47" fill="#93c5fd" font-size="15" font-weight="700">LOCAL LLM AUDIT  /  ILLUSTRATIVE VERDICTS</text>
    <text x="36" y="92" fill="#f8fafc" font-size="34" font-weight="700">One policy, two outcomes</text>
    <rect x="36" y="122" width="432" height="265" rx="16" fill="#1e293b"/>
    <rect x="492" y="122" width="432" height="265" rx="16" fill="#1e293b"/>
    <text x="60" y="160" fill="#86efac" font-size="16" font-weight="700">01  /  PASSED</text>
    <text x="516" y="160" fill="#fda4af" font-size="16" font-weight="700">02  /  FLAGGED</text>
    <g fill="#f8fafc" font-size="24" font-weight="700">
      <text x="60" y="201">Card freeze</text>
      <text x="516" y="201">Savings rate claim</text>
    </g>
    <g fill="#e2e8f0" font-size="19">
      <text x="60" y="246">“Open Cards, select your card,</text>
      <text x="60" y="272">and choose Freeze.”</text>
      <text x="516" y="246">“Ultra guarantees 24.5% APY.”</text>
    </g>
    <path d="M60 298H444 M516 298H900" stroke="#475569"/>
    <g fill="#cbd5e1" font-size="17">
      <text x="60" y="333">The steps match the demo policy.</text>
      <text x="516" y="333">Demo policy specifies 3.00% variable APY</text>
      <text x="516" y="358">with no guarantee.</text>
      <text x="36" y="418" font-size="14">Fictional product data  ·  Expected outcomes for the built-in sample conversations</text>
    </g>
  </g>
</svg>
